services:
  # 1. Shared Redis Cluster Broker for Distributed Pub/Sub
  redis:
    image: redis:7.2-alpine
    container_name: chat_session_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  # 2. Go Auth Microservice
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth_service_api
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - ./services/auth-service/.env
    depends_on:
      - redis
    networks:
      - app_network

  # 3. Go User Profile Microservice
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: user_service_api
    restart: always
    ports:
      - "8002:8002"
    env_file:
      - ./services/user-service/.env
    networks:
      - app_network

  # 4a. Realtime Chat Microservice — NODE 1
  chat-service-1:
    build:
      context: .
      dockerfile: services/chat-service/Dockerfile
    container_name: chat_service_node_1
    restart: always
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - NODE_ID=node-1
      - USER_SERVICE_URL=http://user-service:8002
      - REDIS_ADDR=redis:6379
    env_file:
      - ./services/chat-service/.env
    depends_on:
      - redis
    networks:
      - app_network

  # 4b. Realtime Chat Microservice — NODE 2 (Scale Replica)
  chat-service-2:
    build:
      context: .
      dockerfile: services/chat-service/Dockerfile
    container_name: chat_service_node_2
    restart: always
    ports:
      - "8004:8003"
    environment:
      - PORT=8003
      - NODE_ID=node-2
      - USER_SERVICE_URL=http://user-service:8002
      - REDIS_ADDR=redis:6379
    env_file:
      - ./services/chat-service/.env
    depends_on:
      - redis
    networks:
      - app_network

  # 5. API Gateway with Round-Robin WebSocket Balancing
  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    container_name: gateway_service_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=super_secret_jwt_key_12345
      - AUTH_SERVICE_URL=http://auth-service:8001
      - USER_SERVICE_URL=http://user-service:8002
      - CHAT_SERVICE_1_URL=http://chat-service-1:8003
      - CHAT_SERVICE_2_URL=http://chat-service-2:8003
    depends_on:
      - auth-service
      - user-service
      - chat-service-1
      - chat-service-2
    networks:
      - app_network

  # 6. ⚡ DAY 39: Production Multi-Stage Nginx React Client
  frontend:
    build:
      context: ../frontend/my-react-app # Set to ../frontend (or ../my-react-app if your folder is named differently)
      dockerfile: Dockerfile
    container_name: react_production_app
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - gateway-service
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  redis_data:
    driver: local


