version: '3.8'

services:
  # 1. Local Cache Hub for Chat WebSocket Sessions
  redis:
    image: redis:7.2-alpine
    container_name: chat_session_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  # 2. Containerized Go Auth Microservice
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth_service_api
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - ./services/auth-service/.env  # ◄ Reads isolated auth vars locally
    depends_on:
      - redis
    networks:
      - app_network

  # 3. Containerized Go User Profile Microservice (DAY 9 WORKSPACE EXTENSION)
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: user_service_api
    restart: always
    ports:
      - "8002:8002"
    env_file:
      - ./services/user-service/.env  # ◄ Reads isolated user vars locally
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  redis_data:
    driver: local