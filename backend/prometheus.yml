global:
_scrape_interval: 15s

scrape_configs:
  - job_name: 'gateway-service'
    static_configs:
      - targets: ['gateway-service:8080']

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8001']

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:8002']

  - job_name: 'chat-service-1'
    static_configs:
      - targets: ['chat-service-1:8003']

  - job_name: 'chat-service-2'
    static_configs:
      - targets: ['chat-service-2:8003']