server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Enable Gzip compression for high-performance asset delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # ==========================================
    # 1. React SPA Static Asset Routing & Fallback
    # ==========================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static build chunks aggressively
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # ==========================================
    # 2. REST API Reverse Proxy to Go API Gateway
    # ==========================================
    location /api/ {
        proxy_pass http://gateway-service:8080;
        proxy_http_version 1.1;
        
        # Forward client connection metadata headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for real-time response flows
        proxy_buffering off;
        proxy_read_timeout 90s;
    }

    # ==========================================
    # 3. Persistent WebSocket Proxy & Forwarding
    # ==========================================
    location /ws {
        proxy_pass http://gateway-service:8080;
        proxy_http_version 1.1;

        # Crucial headers required for HTTP-to-WebSocket connection upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Keep WebSocket connection open for long polling / streaming
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}